name: Build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Publish self-contained single file
        run: >
          dotnet publish MiningSupervisor/MiningSupervisor.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o release

      # Every push gets a downloadable build under the workflow run's "Artifacts".
      - uses: actions/upload-artifact@v4
        with:
          name: MiningSupervisor
          path: release/MiningSupervisor.exe

      # Pushing a tag like v1.0.0 additionally publishes a GitHub Release with the exe attached.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/MiningSupervisor.exe
          generate_release_notes: true
